name: e2e-smoke

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/e2e-smoke.yml"
  push:
    branches:
      - main
      - dev
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/e2e-smoke.yml"

concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt -r requirements-test.txt

      - name: Migrate SQLite database
        working-directory: backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/e2e.db
        run: |
          export PYTHONUTF8=1
          export LANG=C.UTF-8
          export LC_ALL=C.UTF-8
          alembic -c alembic-sqlite.ini upgrade head

      - name: Start backend
        working-directory: backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/e2e.db
          APP_HOST: 127.0.0.1
          APP_PORT: "8003"
          LOCAL_AUTH_ENABLED: "1"
          LOCAL_AUTH_USERNAME: admin
          LOCAL_AUTH_PASSWORD: admin123
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8003 > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

      - name: Wait for backend
        run: |
          for i in {1..60}; do
            if curl -fsS "http://127.0.0.1:8003/health" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "backend did not become ready in time"
          cat /tmp/backend.log || true
          exit 1

      - name: Run auth + background-task smoke
        working-directory: frontend
        env:
          CI: "1"
          E2E_REAL_BACKEND: "1"
          APP_HOST: 127.0.0.1
          APP_PORT: "8003"
        run: npm run e2e -- e2e/auth.spec.ts e2e/background-task-pages.spec.ts

      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/backend.pid ]; then
            kill "$(cat /tmp/backend.pid)" || true
          fi
          cat /tmp/backend.log || true
