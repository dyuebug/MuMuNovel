name: backend-ci

on:
  pull_request:
    paths:
      - "backend-rs/**"
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
      - dev
    paths:
      - "backend-rs/**"
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend-rs -> target

      - name: Check formatting
        run: cargo fmt --manifest-path backend-rs/Cargo.toml -- --check

      - name: Check Rust production backend
        run: cargo check --locked --manifest-path backend-rs/Cargo.toml

      - name: Test Rust production backend
        run: cargo test --locked --manifest-path backend-rs/Cargo.toml

      # The repository still has a tracked historical warning baseline. Keep
      # high-confidence correctness and suspicious lints blocking while the
      # remaining warnings are removed in a dedicated cleanup task.
      - name: Lint high-confidence Rust diagnostics
        run: >-
          cargo clippy --locked --manifest-path backend-rs/Cargo.toml
          --all-targets --
          -D clippy::correctness
          -D clippy::suspicious

  python-migration-support:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-migrator.txt
            backend/requirements-test.txt

      - name: Install migration support dependencies
        run: >-
          python -m pip install
          -r requirements-migrator.txt
          -r requirements-test.txt

      - name: Run Python migration and support regressions
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/ci.db
        run: pytest tests/test_tools
