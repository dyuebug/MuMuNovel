# MuMuNovel Strangler Fig Gateway
# ==================================
# Python (127.0.0.1:8000) 闂?default: handles remaining AI-dependent endpoints + static
# Rust   (127.0.0.1:8001) 闂?162 endpoints
#
# Routing strategy: default 闂?Python; known-complete domains 闂?Rust.
# Add more Rust location blocks as coverage grows.

upstream python_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream rust_backend {
    server 127.0.0.1:8001;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # Upload limits
    client_max_body_size 50M;
    client_body_timeout 120s;

    # -------- Health (Rust: 4/4 complete) --------
    location /health { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /livez  { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /readyz { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # -------- Complete Rust domains (no Python-only sub-routes) --------
    # Careers / organizations / relationships: Rust compatibility layer keeps legacy frontend paths.
    location = /api/careers { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/careers/character/ { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/careers/ { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    location = /api/organizations { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/organizations/ { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    location = /api/relationships { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/relationships/ { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # Writing Styles: presets + user styles + project defaults (8/8 complete)
    location = /api/writing-styles { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/writing-styles/ { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # Foreshadows: full state machine + stats + context (13/13 complete)
    location = /api/foreshadows { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/foreshadows/ { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # Background Tasks: Python executes generation jobs; keep create/status/stream on one backend.
    location = /api/background-tasks {
        proxy_pass http://python_backend;
        include conf.d/proxy-common.conf;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
    location /api/background-tasks/ {
        proxy_pass http://python_backend;
        include conf.d/proxy-common.conf;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Admin: user management with permission checks (6/6 complete)
    location /api/admin/ { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # Users: list + current (2/2 complete)
    location = /api/users { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/users/ { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # AI Test: test + test-stream (SSE)
    location /api/ai/ {
        proxy_pass http://rust_backend;
        include conf.d/proxy-common.conf;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # -------- AI orchestration (SSE streaming) --------
    # Wizard world-building + career-system + characters 闂?Rust
    # Wizard world-building: initial + regenerate (2 SSE streams) 闂?Rust
    location ~ ^/api/wizard-stream/world-building/[^/]+/regenerate$ {
        proxy_pass http://rust_backend;
        include conf.d/proxy-common.conf;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
    location /api/wizard-stream/world-building {
        proxy_pass http://rust_backend;
        include conf.d/proxy-common.conf;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
    location /api/wizard-stream/career-system {
        proxy_pass http://rust_backend;
        include conf.d/proxy-common.conf;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
    location /api/wizard-stream/characters {
        proxy_pass http://rust_backend;
        include conf.d/proxy-common.conf;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
    location /api/wizard-stream/outline {
        proxy_pass http://rust_backend;
        include conf.d/proxy-common.conf;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
    # Wizard: all 5 streams migrated 闂?Rust
    location /api/wizard/ {
        proxy_pass http://python_backend;
        include conf.d/proxy-common.conf;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
    location /api/wizard-stream/ {
        proxy_pass http://python_backend;
        include conf.d/proxy-common.conf;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Inspiration: generate-options, refine-options, quick-generate (3/3 complete)
    location = /api/inspiration { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/inspiration/ {
        proxy_pass http://rust_backend;
        include conf.d/proxy-common.conf;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # -------- AI domains migrated to Rust --------
    # Polish: AI闂備礁鎲￠…鍫ヮ敋瑜旈獮?(2/2 complete)
    location = /api/polish           { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/polish/           { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # Book Import: apply (non-streaming) 闂?Rust
    location ~ ^/api/book-import/tasks/[^/]+/apply$ {
        proxy_pass http://rust_backend;
        include conf.d/proxy-common.conf;
    }

    # Book Import: apply-stream (SSE streaming) 闂?Rust
    location ~ ^/api/book-import/tasks/[^/]+/apply-stream {
        proxy_pass http://rust_backend;
        include conf.d/proxy-common.conf;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
    # Book Import: retry-stream (SSE streaming) 闂?Rust
    location ~ ^/api/book-import/tasks/[^/]+/retry-stream {
        proxy_pass http://rust_backend;
        include conf.d/proxy-common.conf;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Book Import: all endpoints (7/7 complete) 闂?Rust
    location = /api/book-import      { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/book-import/      { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # Prompt Templates: CRUD + sync + export/import + preview (13/13 complete)
    location = /api/prompt-templates { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/prompt-templates/ { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # Prompt Workshop: keep Python for client-mode cloud proxy support.
    location = /api/prompt-workshop { proxy_pass http://python_backend; include conf.d/proxy-common.conf; }
    location /api/prompt-workshop/ { proxy_pass http://python_backend; include conf.d/proxy-common.conf; }

    # MCP Plugins: CRUD + toggle + status + tools + metrics (14/14, test excluded)
    location = /api/mcp { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/mcp/ { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # Changelog: GitHub API proxy with cache (2/2 complete, public)
    location = /api/changelog { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/changelog/ { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # Memories: no /api prefix
    location /memories/ { proxy_pass http://python_backend; include conf.d/proxy-common.conf; }

    # -------- Auth: Rust default, Python for Linux DO OAuth --------
    location /api/auth/linuxdo/  { proxy_pass http://python_backend; include conf.d/proxy-common.conf; }
    location /api/auth/bind/     { proxy_pass http://python_backend; include conf.d/proxy-common.conf; }
    location /api/auth/refresh   { proxy_pass http://python_backend; include conf.d/proxy-common.conf; }
    location /api/auth/          { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # -------- Mixed domains: Python default (has sub-routes Rust lacks) --------
    # /api/projects/   闂?Python has analysis/export/search/memories sub-routes
    # /api/outlines/   闂?Python has expand-stream/chapters-from-plans sub-routes
    # /api/characters/ 闂?Python has career-system sub-routes
    # /api/chapters/   闂?Python has generation/analysis/annotation/draft/expansion/regeneration
    # /api/settings/   闂?Python has models/test/test-web-research/check-function-calling;
    #                     Rust has presets CRUD ready (activate when test endpoint is migrated)

    # Projects: keep Python for analysis-heavy subroutes, but send Rust-compatible endpoints to Rust.
    location = /api/projects                                  { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location ~ ^/api/projects/[^/]+$                          { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location = /api/projects/validate-import                  { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location ~ ^/api/projects/[^/]+/export$                   { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location ~ ^/api/projects/[^/]+/export-data$              { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # Chapters: keep analysis/generation on Python, route basic CRUD + compatibility reads to Rust.
    location = /api/chapters                                  { proxy_pass http://python_backend; include conf.d/proxy-common.conf; }
    location ~ ^/api/chapters/[^/]+$                          { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location ~ ^/api/chapters/project/[^/]+$                  { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location ~ ^/api/chapters/project/[^/]+/quality-trend$    { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location ~ ^/api/chapters/[^/]+/navigation$               { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location ~ ^/api/chapters/[^/]+/expansion-plan$           { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location ~ ^/api/chapters/[^/]+/annotations$              { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location ~ ^/api/chapters/[^/]+/can-generate$             { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    # -------- API catch-all: Python (default) --------
    location /api/ {
        proxy_pass http://python_backend;
        include conf.d/proxy-common.conf;
    }

    # -------- Static files (serve directly from nginx for max perf) --------
    location /assets/ {
        root /app/static;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /favicon.ico {
        root /app/static;
        expires 7d;
        try_files $uri =404;
    }

    # -------- SPA fallback --------
    location / {
        root /app/static;
        try_files $uri $uri/ /index.html;
    }
}

