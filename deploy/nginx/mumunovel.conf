# MuMuNovel Strangler Fig Gateway
# ==================================
# Python (127.0.0.1:8000) — default: handles ALL 127 endpoints + static
# Rust   (127.0.0.1:8001) — 77 CRUD endpoints, ~60.6% coverage
#
# Routing strategy: default → Python; known-complete domains → Rust.
# Add more Rust location blocks as coverage grows.

upstream python_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream rust_backend {
    server 127.0.0.1:8001;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # Upload limits
    client_max_body_size 50M;
    client_body_timeout 120s;

    # -------- Health (Rust: 4/4 complete) --------
    location /health { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /livez  { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /readyz { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # -------- Complete Rust domains (no Python-only sub-routes) --------
    # Careers: pure CRUD
    location /api/careers/ { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # Organizations: pure CRUD
    location /api/organizations/ { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # Relationships: pure CRUD
    location /api/relationships/ { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # Writing Styles: presets + user styles + project defaults (8/8 complete)
    location /api/writing-styles/ { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # Foreshadows: full state machine + stats + context (13/13 complete)
    location /api/foreshadows/ { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # Background Tasks: CRUD + SSE stream + cancel + workflow (6/6 complete)
    # SSE needs buffering off and long timeouts
    location /api/background-tasks/ {
        proxy_pass http://rust_backend;
        include conf.d/proxy-common.conf;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Admin: user management with permission checks (6/6 complete)
    location /api/admin/ { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # Users: list + current (2/2 complete)
    location /api/users/ { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # AI Test: test + test-stream (SSE)
    location /api/ai/ {
        proxy_pass http://rust_backend;
        include conf.d/proxy-common.conf;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # -------- Python-only: AI orchestration (SSE streaming) --------
    # Wizard: world-building, career-system, characters, outline (5 SSE streams)
    location /api/wizard/ {
        proxy_pass http://python_backend;
        include conf.d/proxy-common.conf;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Inspiration: generate-options, refine-options, quick-generate (3 AI)
    location /api/inspiration/ {
        proxy_pass http://python_backend;
        include conf.d/proxy-common.conf;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # -------- Python-only: other AI domains --------
    location /api/prompt-workshop/  { proxy_pass http://python_backend; include conf.d/proxy-common.conf; }
    location /api/prompt-templates/ { proxy_pass http://python_backend; include conf.d/proxy-common.conf; }
    location /api/polish/           { proxy_pass http://python_backend; include conf.d/proxy-common.conf; }
    location /api/mcp/              { proxy_pass http://python_backend; include conf.d/proxy-common.conf; }
    location /api/book-import/      { proxy_pass http://python_backend; include conf.d/proxy-common.conf; }
    location /api/changelog/        { proxy_pass http://python_backend; include conf.d/proxy-common.conf; }

    # Memories: no /api prefix
    location /memories/ { proxy_pass http://python_backend; include conf.d/proxy-common.conf; }

    # -------- Mixed domains: Python default (has sub-routes Rust lacks) --------
    # /api/auth/       — Python has linuxdo/bind/password routes
    # /api/projects/   — Python has analysis/export/search/memories sub-routes
    # /api/outlines/   — Python has expand-stream/chapters-from-plans sub-routes
    # /api/characters/ — Python has career-system sub-routes
    # /api/chapters/   — Python has generation/analysis/annotation/draft/expansion/regeneration
    # /api/settings/   — Python has models/test/presets sub-routes

    # -------- API catch-all: Python (default) --------
    location /api/ {
        proxy_pass http://python_backend;
        include conf.d/proxy-common.conf;
    }

    # -------- Static files (serve directly from nginx for max perf) --------
    location /assets/ {
        root /app/static;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /favicon.ico {
        root /app/static;
        expires 7d;
        try_files $uri =404;
    }

    # -------- SPA fallback --------
    location / {
        root /app/static;
        try_files $uri $uri/ /index.html;
    }
}
