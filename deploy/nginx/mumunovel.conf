# MuMuNovel Strangler Fig Gateway
# ==================================
# Python (127.0.0.1:8000) 闂?default: handles remaining AI-dependent endpoints + static
# Rust   (127.0.0.1:8001) 闂?162 endpoints
#
# Routing strategy: default 闂?Python; known-complete domains 闂?Rust.
# Add more Rust location blocks as coverage grows.

upstream python_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream rust_backend {
    server 127.0.0.1:8001;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # Upload limits
    client_max_body_size 50M;
    client_body_timeout 120s;

    # -------- Health (Rust: 4/4 complete) --------
    location /health { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /livez  { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /readyz { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # -------- Complete Rust domains (no Python-only sub-routes) --------
    # Careers API owner: /api/careers* is now Rust-owned.
    # Restore Python only through an explicit gateway rollback step.
    location = /api/careers { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/careers/character/ { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/careers/ { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # Organizations API owner: /api/organizations* is now Rust-owned.
    # Restore Python only through an explicit gateway rollback step.
    location = /api/organizations { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/organizations/ { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # Relationships API owner: /api/relationships* is now Rust-owned.
    # Restore Python only through an explicit gateway rollback step.
    location = /api/relationships { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/relationships/ { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # Writing Styles API owner: /api/writing-styles* is now Rust-owned.
    # Restore Python only through an explicit gateway rollback step.
    location = /api/writing-styles { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/writing-styles/ { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # Foreshadows API owner: /api/foreshadows* is now Rust-owned.
    # Restore Python only through an explicit gateway rollback step.
    location = /api/foreshadows { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/foreshadows/ { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # Background Tasks API owner: /api/background-tasks* is now Rust-owned.
    # Python same-path fallback is only kept for explicit gateway rollback.
    location = /api/background-tasks {
        proxy_pass http://rust_backend;
        include conf.d/proxy-common.conf;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
    location /api/background-tasks/ {
        proxy_pass http://rust_backend;
        include conf.d/proxy-common.conf;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Admin: user management with permission checks (6/6 complete)
    location /api/admin/ { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # Users: list + current (2/2 complete)
    location = /api/users { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/users/ { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # AI Test: test + test-stream (SSE)
    location /api/ai-test {
        proxy_pass http://rust_backend;
        include conf.d/proxy-common.conf;
    }
    location /api/ai/ {
        proxy_pass http://rust_backend;
        include conf.d/proxy-common.conf;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # -------- AI orchestration (SSE streaming) --------
    # Wizard-stream: all current SSE endpoints are owned by Rust.
    # No independent Python /api/wizard/* route group remains.
    location /api/wizard-stream/ {
        proxy_pass http://rust_backend;
        include conf.d/proxy-common.conf;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Inspiration API owner: /api/inspiration* is now Rust-owned.
    # Restore Python only through an explicit gateway rollback step.
    location = /api/inspiration { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/inspiration/ {
        proxy_pass http://rust_backend;
        include conf.d/proxy-common.conf;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # -------- AI domains migrated to Rust --------
    # Polish API owner: /api/polish* is now Rust-owned.
    # Restore Python only through an explicit gateway rollback step.
    location = /api/polish           { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/polish/           { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # Book Import: apply (non-streaming) 闂?Rust
    location ~ ^/api/book-import/tasks/[^/]+/apply$ {
        proxy_pass http://rust_backend;
        include conf.d/proxy-common.conf;
    }

    # Book Import: apply-stream (SSE streaming) 闂?Rust
    location ~ ^/api/book-import/tasks/[^/]+/apply-stream {
        proxy_pass http://rust_backend;
        include conf.d/proxy-common.conf;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
    # Book Import: retry-stream (SSE streaming) 闂?Rust
    location ~ ^/api/book-import/tasks/[^/]+/retry-stream {
        proxy_pass http://rust_backend;
        include conf.d/proxy-common.conf;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Book Import: all endpoints (7/7 complete) 闂?Rust
    location = /api/book-import      { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/book-import/      { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # Prompt Templates API owner: /api/prompt-templates* is now Rust-owned.
    # Restore Python only through an explicit gateway rollback step.
    location = /api/prompt-templates { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/prompt-templates/ { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # Prompt Workshop API owner: /api/prompt-workshop* is now Rust-owned.
    # Restore Python only through an explicit gateway rollback step.
    location = /api/prompt-workshop { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/prompt-workshop/ { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # MCP Plugins API owner: /api/mcp* is now Rust-owned.
    # Restore Python only through an explicit gateway rollback step.
    location = /api/mcp { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/mcp/ { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # Changelog API owner: /api/changelog* is now Rust-owned.
    # Restore Python only through an explicit gateway rollback step.
    location = /api/changelog { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/changelog/ { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # Memories API owner: /api/memories/* is now Rust-owned.
    # Keep /memories/* on Python because it is still the page/non-API boundary.
    location ~ ^/api/memories/projects/[^/]+/analyze-chapter/[^/]+$ { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/memories/ { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /memories/ { proxy_pass http://python_backend; include conf.d/proxy-common.conf; }

    # -------- Auth: LinuxDO OAuth callbacks + local/bind/session auth are implemented in Rust --------
    location /api/auth/linuxdo/  { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/auth/          { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # -------- Mixed domains: Python default (has sub-routes Rust lacks) --------
    # /api/outlines/   Rust has generate/expand/batch-expand/create-chapters compatibility routes
    # /api/characters/ Rust has CRUD + generation compatibility routes
    # /api/chapters/   Rust has CRUD/generation/analysis/regeneration compatibility routes
    # /api/settings/   Rust has full compatibility coverage for settings/config/model tests
    # /api/foreshadows/ Rust has all current CRUD/context/stats routes

    # Projects: keep one Rust-owned exact root plus a shared prefix to avoid per-path drift.
    location = /api/projects                                  { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/projects/                                   { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # Characters: all current CRUD + generation compatibility endpoints are implemented in Rust.
    location = /api/characters/generate-stream                { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; include conf.d/sse-common.conf; }
    location = /api/characters/generate                       { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location = /api/characters                                { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location = /api/characters/validate-import                { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location = /api/characters/export                         { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location = /api/characters/import                         { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location ~ ^/api/characters/project/[^/]+$                { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location ~ ^/api/characters/[^/]+$                        { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # Outlines: all current CRUD + expansion compatibility endpoints are implemented in Rust.
    location = /api/outlines                                  { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/outlines/                                   { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # Careers / organizations already default to Rust via the complete-domain prefix rules above.
    # Keep only Python-only AI endpoints as exact overrides here.
    location = /api/careers/generate-system                   { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; include conf.d/sse-common.conf; }
    location = /api/organizations/generate-stream             { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; include conf.d/sse-common.conf; }

    # Settings: keep one Rust-owned exact root plus a shared prefix to avoid per-path drift.
    location = /api/settings                                  { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/settings/                                   { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # Foreshadows API owner: /api/foreshadows* is now Rust-owned.
    # Restore Python only through an explicit gateway rollback step.
    location = /api/foreshadows                               { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/foreshadows/                                { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # Chapters: all current CRUD + generation/analysis/regeneration compatibility endpoints are implemented in Rust.
    location = /api/chapters                                  { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/chapters/                                   { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location ~ ^/api/chapters/[^/]+$                          { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location ~ ^/api/chapters/project/[^/]+$                  { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location ~ ^/api/chapters/project/[^/]+/quality-trend$    { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location ~ ^/api/chapters/[^/]+/navigation$               { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location ~ ^/api/chapters/[^/]+/expansion-plan$           { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location ~ ^/api/chapters/[^/]+/annotations$              { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location ~ ^/api/chapters/[^/]+/can-generate$             { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location ~ ^/api/chapters/[^/]+/analysis(/.*)?$           { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location ~ ^/api/chapters/[^/]+/generate-stream$          { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; include conf.d/sse-common.conf; }
    location ~ ^/api/chapters/[^/]+/generate-background$      { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location ~ ^/api/chapters/[^/]+/regenerate-stream$        { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; include conf.d/sse-common.conf; }
    location ~ ^/api/chapters/[^/]+/partial-regenerate-stream$ { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; include conf.d/sse-common.conf; }
    location ~ ^/api/chapters/[^/]+/apply-partial-regenerate$ { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location ~ ^/api/chapters/[^/]+/regeneration/tasks$       { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location = /api/chapters/analysis/status/batch            { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location ~ ^/api/chapters/project/[^/]+/batch-generate$   { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location ~ ^/api/chapters/batch-generate/[^/]+/status$    { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location ~ ^/api/chapters/batch-generate/[^/]+/stream$    { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; include conf.d/sse-common.conf; }
    location ~ ^/api/chapters/project/[^/]+/batch-generate/active$ { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location = /api/chapters/batch-generate/active-tasks      { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location ~ ^/api/chapters/batch-generate/[^/]+/cancel$    { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location ~ ^/api/chapters/batch-generate/[^/]+/resume$    { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    # -------- API catch-all: Python (default) --------
    location /api/ {
        proxy_pass http://python_backend;
        include conf.d/proxy-common.conf;
    }

    # -------- Static files (serve directly from nginx for max perf) --------
    location /assets/ {
        root /app/static;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /favicon.ico {
        root /app/static;
        expires 7d;
        try_files $uri =404;
    }

    # -------- SPA fallback --------
    location / {
        root /app/static;
        try_files $uri $uri/ /index.html;
    }
}
