# =============================================================================
# MuMuNovel Strangler Fig — Nginx for Docker Compose
# =============================================================================
# Python (python-backend:8000) — AI 兜底 + 静态文件
# Rust   (rust-backend:8001)   — 162 端点 (绞杀者)
#
# 与 deploy/nginx/mumunovel.conf 功能一致，但 upstream 使用 Docker 容器名。
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    upstream python_backend {
    server python-backend:8000;
    keepalive 32;
}

upstream rust_backend {
    server rust-backend:8001;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # 访问日志
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # 客户端上传限制
    client_max_body_size 50m;
    client_body_timeout 60s;

    # Strip trailing slashes for Rust backend (Axum routes don't match /api/settings/)
    # Only for /api/ paths, preserve root / for SPA
    rewrite ^(/api/.*)/$ $1 last;

    # -------- 健康检查 --------
    location /health   { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /livez    { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /readyz   { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /health/db-sessions { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # -------- 核心域（完整迁移） → Rust (CRUD) --------
    location /api/users             { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/careers           { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/organizations     { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/relationships     { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/writing-styles    { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/foreshadows       { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/ai-test           { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/background-tasks  { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # -------- 混合域 → Python 兜底（Rust 未覆盖子路由） --------
    # /api/projects/   — Python has analysis/export/search/memories sub-routes
    # /api/outlines/   — Python has expand-stream/chapters-from-plans sub-routes
    # /api/characters/ — Python has career-system sub-routes
    # /api/chapters/   — Python has batch-generate/generation/analysis/regeneration sub-routes
    # /api/settings/   — Python has models/test/test-web-research/check-function-calling sub-routes

    # Admin (公开)
    location /api/admin             { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # -------- SSE 流式域 → Rust --------
    # Wizard SSE streams — 5 个
    location /api/wizard-stream/world-building { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; include conf.d/sse-common.conf; }
    location /api/wizard-stream/career-system { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; include conf.d/sse-common.conf; }
    location /api/wizard-stream/characters    { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; include conf.d/sse-common.conf; }
    location /api/wizard-stream/outline       { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; include conf.d/sse-common.conf; }
    location /api/wizard-stream/regenerate    { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; include conf.d/sse-common.conf; }

    # Inspiration (shorter timeout)
    location /api/inspiration {
        proxy_pass http://rust_backend;
        include conf.d/proxy-common.conf;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # -------- AI 域 → Rust --------
    location /api/polish            { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # Book Import (含 SSE streaming)
    location /api/book-import       { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location ~ ^/api/book-import/tasks/[^/]+/apply-stream  { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; include conf.d/sse-common.conf; }
    location ~ ^/api/book-import/tasks/[^/]+/retry-stream  { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; include conf.d/sse-common.conf; }

    # Prompt Templates + Workshop
    location /api/prompt-templates  { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/prompt-workshop   { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # MCP Plugins (15/15 complete)
    location /api/mcp              { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # Changelog (公开)
    location /api/changelog        { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # -------- Auth: Rust 主，Python 兜 LinuxDO OAuth --------
    location /api/auth/linuxdo    { proxy_pass http://python_backend; include conf.d/proxy-common.conf; }
    location /api/auth/bind       { proxy_pass http://python_backend; include conf.d/proxy-common.conf; }
    location /api/auth/refresh    { proxy_pass http://python_backend; include conf.d/proxy-common.conf; }
    location /api/auth            { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # -------- Memories → Python (无 /api 前缀) --------
    location /memories            { proxy_pass http://python_backend; include conf.d/proxy-common.conf; }

    # -------- API 兜底 → Python --------
    location /api {
        proxy_pass http://python_backend;
        include conf.d/proxy-common.conf;
    }

    # -------- 静态文件 → Python (有 embedding 等静态资源) --------
    location / {
        proxy_pass http://python_backend;
        include conf.d/proxy-common.conf;
    }
}
}