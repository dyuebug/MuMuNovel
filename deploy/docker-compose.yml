version: "3.9"

services:
  # ============================================================
  # Gateway: nginx strangler fig — routes CRUD to Rust, AI to Python
  # ============================================================
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./nginx/mumunovel-docker.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/proxy-common.conf:/etc/nginx/conf.d/proxy-common.conf:ro
      - ./nginx/conf.d/sse-common.conf:/etc/nginx/conf.d/sse-common.conf:ro
      - ../backend/static:/app/static:ro
    depends_on:
      - python
      - rust
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ============================================================
  # Python backend: AI orchestration (50 endpoints)
  # ============================================================
  python:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../backend/data:/app/data
      - ../backend/static:/app/static
    environment:
      - APP_PORT=8000
      - APP_HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./data/mumunovel.db}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=HS256
      - LOCAL_AUTH_ENABLED=true
      - LOCAL_AUTH_USERNAME=${LOCAL_AUTH_USERNAME:-admin}
      - LOCAL_AUTH_PASSWORD=${LOCAL_AUTH_PASSWORD:-admin123}
      - LOCAL_AUTH_DISPLAY_NAME=${LOCAL_AUTH_DISPLAY_NAME:-本地管理员}
      - LINUXDO_CLIENT_ID=${LINUXDO_CLIENT_ID:-}
      - LINUXDO_CLIENT_SECRET=${LINUXDO_CLIENT_SECRET:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DEBUG=${DEBUG:-false}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ============================================================
  # Rust backend: CRUD operations (77 endpoints)
  # ============================================================
  rust:
    build:
      context: ../backend-rs
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ../backend/data:/app/data
      - ../backend/static:/app/static
    environment:
      - APP_PORT=8001
      - APP_HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL:-sqlite:./data/mumunovel.db?mode=rwc}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=HS256
      - STATIC_DIR=/app/static
      - LOCAL_AUTH_ENABLED=${LOCAL_AUTH_ENABLED:-true}
      - LOCAL_AUTH_USERNAME=${LOCAL_AUTH_USERNAME:-admin}
      - LOCAL_AUTH_PASSWORD=${LOCAL_AUTH_PASSWORD:-admin123}
      - LOCAL_AUTH_DISPLAY_NAME=${LOCAL_AUTH_DISPLAY_NAME:-本地管理员}
      - RUST_LOG=${RUST_LOG:-info}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
