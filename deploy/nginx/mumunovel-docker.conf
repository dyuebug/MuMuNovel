worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream_addr=$upstream_addr upstream_status=$upstream_status '
                    'upstream_response_time=$upstream_response_time';

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    upstream python_backend {
    server python-backend:8000;
    keepalive 32;
}

upstream rust_backend {
    server rust-backend:8001;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # 记录 upstream 命中信息，便于区分请求落到 Python 还是 Rust
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Upload limits
    client_max_body_size 50m;
    client_body_timeout 60s;

    # Strip trailing slashes for Rust backend (Axum routes don't match /api/settings/)
    # Only for /api/ paths, preserve root / for SPA
    rewrite ^(/api/.*)/$ $1 last;

    # -------- 闂傚倷鑳堕…鍫ヮ敄閸愵喖纾块梺顒€绉寸粻鏍偓骞垮劚閹叉ê鈽夐姀鐘靛姦濡炪倖甯掔€氼剟鎷?--------
    location /health   { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /livez    { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /readyz   { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /health/db-sessions { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # -------- 闂傚倷绀侀幖顐ょ矓閸洍鈧箓宕奸姀銏㈠婵°倧绲介崯顐﹀及閵夆晜鐓熼柡鍥╁仜閳ь剝宕电划鍫ュ礋椤栨稑鈧敻鏌ｉ悢鍝勵暭婵犫偓娴煎瓨鐓涢柛鈽嗗幘缁嬬粯绻涢懖鈺冨笡闁瑰嘲鎳橀幆鍕箳閸℃ɑ鐝氶梺?闂?Rust (CRUD) --------
    location /api/users             { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    # Careers / organizations / relationships: Rust compatibility layer keeps legacy frontend paths.
    location /api/careers/character/ { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/careers           { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/organizations     { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/relationships     { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/writing-styles    { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/foreshadows       { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/ai-test           { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location /api/ai/               { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; include conf.d/sse-common.conf; }
    # Background Tasks: current create/status/stream/cancel/workflow-state endpoints are implemented in Rust.
    location /api/background-tasks  { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; include conf.d/sse-common.conf; }

    # -------- 濠电姷鏁搁崕鎴犲緤娴犲搴婇柡灞诲劚缁犳牠骞栧ǎ顒€濡奸柡?闂?Python 闂傚倷鑳堕…鍫㈡崲閹寸姴鍨濈€光偓閳ь剟鎳為柆宥呯闁兼亽鍎插▍鏍⒑闂堚晛鐦滄繝褌澶焧 闂傚倷绀侀幖顐︽偋濠婂嫮顩查柨婵嗩槶閳ь剙鎳橀、鏇㈡晜閽樺澹嗛梻浣告惈鐠囩偤宕ㄩ钘夋殟闂備浇宕垫慨宕囨媰閿曞倸鍨傞柟鎯版閺嬩線姊洪鈧粔鐢稿疾?--------
    # /api/projects/   Python still keeps analysis/export/search/memories-heavy sub-routes
    # /api/outlines/   Rust has generate/expand/batch-expand/create-chapters compatibility routes
    # /api/characters/ Rust has CRUD + generation compatibility routes
    # /api/chapters/   Rust has CRUD/generation/analysis/regeneration compatibility routes
    # /api/settings/   Rust has full compatibility coverage for settings/config/model tests

    # Projects: keep Python for analysis-heavy subroutes, but send Rust-compatible endpoints to Rust.
