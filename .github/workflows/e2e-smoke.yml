name: e2e-smoke

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend-rs/**"
      - "backend/**"
      - ".github/workflows/e2e-smoke.yml"
  push:
    branches:
      - main
      - dev
    paths:
      - "frontend/**"
      - "backend-rs/**"
      - "backend/**"
      - ".github/workflows/e2e-smoke.yml"

concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-real-backend-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mumu_e2e
          POSTGRES_USER: mumu_e2e
          POSTGRES_PASSWORD: mumu_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mumu_e2e -d mumu_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mumu_e2e:mumu_e2e@127.0.0.1:5432/mumu_e2e
      DEBUG: "false"
      JWT_SECRET: e2e-rust-runtime-secret
      ENABLE_STARTUP_SCHEMA_SYNC: "false"
      APP_HOST: 127.0.0.1
      APP_PORT: "8003"
      LOCAL_AUTH_ENABLED: "1"
      LOCAL_AUTH_USERNAME: admin
      LOCAL_AUTH_PASSWORD: admin123
      STATIC_DIR: ../backend/static

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend-rs -> target

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Migrate PostgreSQL with Rust
        working-directory: backend-rs
        run: |
          mkdir -p ../e2e-diagnostics
          set +e
          cargo run --locked -- migration-executor \
            > ../e2e-diagnostics/migration-executor.json \
            2> ../e2e-diagnostics/migration-executor-stderr.log
          migration_exit_code=$?
          set -e
          printf '%s\n' "$migration_exit_code" > ../e2e-diagnostics/migration-executor-exit-code.txt
          cat ../e2e-diagnostics/migration-executor.json
          cat ../e2e-diagnostics/migration-executor-stderr.log >&2
          if [ "$migration_exit_code" -ne 0 ]; then
            echo "Rust migration executor failed with exit code $migration_exit_code"
            exit "$migration_exit_code"
          fi

      - name: Verify Rust release readiness preflight
        working-directory: backend-rs
        run: |
          mkdir -p ../e2e-diagnostics
          set +e
          cargo run --locked -- release-readiness-preflight \
            > ../e2e-diagnostics/release-preflight.json \
            2> ../e2e-diagnostics/release-preflight-stderr.log
          preflight_exit_code=$?
          set -e
          printf '%s\n' "$preflight_exit_code" > ../e2e-diagnostics/release-preflight-exit-code.txt
          cat ../e2e-diagnostics/release-preflight.json
          cat ../e2e-diagnostics/release-preflight-stderr.log >&2
          if [ "$preflight_exit_code" -ne 0 ]; then
            echo "Rust release readiness preflight failed with exit code $preflight_exit_code"
            exit "$preflight_exit_code"
          fi

      - name: Start Rust backend
        working-directory: backend-rs
        run: |
          mkdir -p ../e2e-diagnostics
          cargo build --locked
          binary_path="$(realpath ./target/debug/mumu-novel-backend)"
          binary_sha256="$(sha256sum "$binary_path" | awk '{print $1}')"
          printf '%s\n' "$binary_path" > ../e2e-diagnostics/rust-backend-binary-path.txt
          printf '%s\n' "$binary_sha256" > ../e2e-diagnostics/rust-backend-binary-sha256.txt

          nohup "$binary_path" \
            > ../e2e-diagnostics/rust-backend.log 2>&1 &
          backend_pid=$!
          printf '%s\n' "$backend_pid" > /tmp/rust-backend.pid
          printf '%s\n' "$backend_pid" > ../e2e-diagnostics/rust-backend.pid

          for _ in {1..10}; do
            if [ -e "/proc/$backend_pid/exe" ]; then
              break
            fi
            if ! kill -0 "$backend_pid" 2>/dev/null; then
              break
            fi
            sleep 0.1
          done

          if [ ! -e "/proc/$backend_pid/exe" ]; then
            cat > ../e2e-diagnostics/rust-backend-identity.json <<EOF
          {
            "schema_version": 1,
            "runtime_owner": "backend-rs",
            "process_pid": ${backend_pid},
            "expected_binary_path": "${binary_path}",
            "expected_binary_sha256": "${binary_sha256}",
            "identity_status": "process_executable_unavailable"
          }
          EOF
            cat ../e2e-diagnostics/rust-backend-identity.json
            cat ../e2e-diagnostics/rust-backend.log || true
            exit 1
          fi

          observed_binary_path="$(readlink -f "/proc/$backend_pid/exe")"
          observed_binary_sha256="$(sha256sum "/proc/$backend_pid/exe" | awk '{print $1}')"
          identity_status="verified"
          if [ "$observed_binary_path" != "$binary_path" ] || [ "$observed_binary_sha256" != "$binary_sha256" ]; then
            identity_status="mismatch"
          fi
          cat > ../e2e-diagnostics/rust-backend-identity.json <<EOF
          {
            "schema_version": 1,
            "runtime_owner": "backend-rs",
            "process_pid": ${backend_pid},
            "expected_binary_path": "${binary_path}",
            "observed_binary_path": "${observed_binary_path}",
            "expected_binary_sha256": "${binary_sha256}",
            "observed_binary_sha256": "${observed_binary_sha256}",
            "identity_status": "${identity_status}"
          }
          EOF
          cat ../e2e-diagnostics/rust-backend-identity.json
          if [ "$identity_status" != "verified" ]; then
            echo "Rust backend process identity did not match the built binary"
            exit 1
          fi

      - name: Wait for Rust backend readiness
        run: |
          readyz_url="http://127.0.0.1:8003/readyz"
          readyz_body="e2e-diagnostics/readyz.json"
          readyz_status_file="e2e-diagnostics/readyz-http-status.txt"
          for i in {1..60}; do
            http_status="$(curl -sS -o "$readyz_body" -w "%{http_code}" "$readyz_url" || true)"
            printf '%s\n' "$http_status" > "$readyz_status_file"
            if [ "$http_status" = "200" ]; then
              exit 0
            fi
            sleep 1
          done
          echo "Rust backend did not become ready in time"
          echo "Last /readyz HTTP status: $(cat "$readyz_status_file" 2>/dev/null || echo unavailable)"
          echo "Last /readyz response:"
          cat "$readyz_body" || true
          echo "Rust backend log:"
          cat e2e-diagnostics/rust-backend.log || true
          exit 1

      - name: Verify Rust release readiness contract
        run: |
          releasez_url="http://127.0.0.1:8003/releasez"
          releasez_body="e2e-diagnostics/releasez.json"
          releasez_status_file="e2e-diagnostics/releasez-http-status.txt"
          http_status="$(curl -sS -o "$releasez_body" -w "%{http_code}" "$releasez_url" || true)"
          printf '%s\n' "$http_status" > "$releasez_status_file"
          if [ "$http_status" = "200" ]; then
            echo "Rust release readiness contract verified"
            exit 0
          fi
          echo "Rust release readiness contract failed"
          echo "Last /releasez HTTP status: $(cat "$releasez_status_file" 2>/dev/null || echo unavailable)"
          echo "Last /releasez response:"
          cat "$releasez_body" || true
          echo "Last /readyz response:"
          cat e2e-diagnostics/readyz.json || true
          exit 1

      - name: Run auth + background-task smoke against Rust
        working-directory: frontend
        env:
          CI: "1"
          E2E_REAL_BACKEND: "1"
        run: |
          set -o pipefail
          set +e
          npm run e2e -- e2e/auth.spec.ts e2e/background-task-pages.spec.ts \
            2>&1 | tee ../e2e-diagnostics/playwright-smoke.log
          playwright_exit_code=$?
          set -e
          printf '%s\n' "$playwright_exit_code" > ../e2e-diagnostics/playwright-smoke-exit-code.txt
          exit "$playwright_exit_code"

      - name: Stop Rust backend and record lifecycle
        if: always()
        run: |
          lifecycle_file="e2e-diagnostics/rust-backend-lifecycle.json"
          if [ ! -f /tmp/rust-backend.pid ]; then
            cat > "$lifecycle_file" <<EOF
          {
            "schema_version": 1,
            "runtime_owner": "backend-rs",
            "process_target": "./target/debug/mumu-novel-backend",
            "identity_status": "not_available",
            "cleanup_status": "not_started",
            "termination_signal": null
          }
          EOF
            cat "$lifecycle_file"
            exit 0
          fi

          backend_pid="$(cat /tmp/rust-backend.pid)"
          case "$backend_pid" in
            ''|*[!0-9]*)
              cat > "$lifecycle_file" <<EOF
          {
            "schema_version": 1,
            "runtime_owner": "backend-rs",
            "process_target": "./target/debug/mumu-novel-backend",
            "process_pid_raw": "${backend_pid}",
            "identity_status": "invalid_pid",
            "cleanup_status": "signal_refused",
            "termination_signal": null
          }
          EOF
              cat "$lifecycle_file"
              exit 1
              ;;
          esac

          if [ ! -f e2e-diagnostics/rust-backend-binary-path.txt ] || [ ! -f e2e-diagnostics/rust-backend-binary-sha256.txt ]; then
            cat > "$lifecycle_file" <<EOF
          {
            "schema_version": 1,
            "runtime_owner": "backend-rs",
            "process_target": "./target/debug/mumu-novel-backend",
            "process_pid": ${backend_pid},
            "identity_status": "expected_identity_missing",
            "cleanup_status": "signal_refused",
            "termination_signal": null
          }
          EOF
            cat "$lifecycle_file"
            exit 1
          fi

          expected_binary_path="$(cat e2e-diagnostics/rust-backend-binary-path.txt)"
          expected_binary_sha256="$(cat e2e-diagnostics/rust-backend-binary-sha256.txt)"
          if ! kill -0 "$backend_pid" 2>/dev/null; then
            cat > "$lifecycle_file" <<EOF
          {
            "schema_version": 1,
            "runtime_owner": "backend-rs",
            "process_target": "./target/debug/mumu-novel-backend",
            "process_pid": ${backend_pid},
            "expected_binary_path": "${expected_binary_path}",
            "expected_binary_sha256": "${expected_binary_sha256}",
            "identity_status": "process_unavailable",
            "cleanup_status": "already_exited",
            "termination_signal": null
          }
          EOF
            cat "$lifecycle_file"
            cat e2e-diagnostics/rust-backend.log || true
            exit 1
          fi

          if [ ! -e "/proc/$backend_pid/exe" ]; then
            cat > "$lifecycle_file" <<EOF
          {
            "schema_version": 1,
            "runtime_owner": "backend-rs",
            "process_target": "./target/debug/mumu-novel-backend",
            "process_pid": ${backend_pid},
            "expected_binary_path": "${expected_binary_path}",
            "expected_binary_sha256": "${expected_binary_sha256}",
            "identity_status": "process_executable_unavailable",
            "cleanup_status": "signal_refused",
            "termination_signal": null
          }
          EOF
            cat "$lifecycle_file"
            exit 1
          fi

          observed_binary_path="$(readlink -f "/proc/$backend_pid/exe")"
          observed_binary_sha256="$(sha256sum "/proc/$backend_pid/exe" | awk '{print $1}')"
          if [ "$observed_binary_path" != "$expected_binary_path" ] || [ "$observed_binary_sha256" != "$expected_binary_sha256" ]; then
            cat > "$lifecycle_file" <<EOF
          {
            "schema_version": 1,
            "runtime_owner": "backend-rs",
            "process_target": "./target/debug/mumu-novel-backend",
            "process_pid": ${backend_pid},
            "expected_binary_path": "${expected_binary_path}",
            "observed_binary_path": "${observed_binary_path}",
            "expected_binary_sha256": "${expected_binary_sha256}",
            "observed_binary_sha256": "${observed_binary_sha256}",
            "identity_status": "mismatch",
            "cleanup_status": "signal_refused",
            "termination_signal": null
          }
          EOF
            cat "$lifecycle_file"
            echo "Refusing to signal PID $backend_pid because process identity does not match"
            exit 1
          fi

          kill -TERM "$backend_pid"
          for _ in {1..10}; do
            if ! kill -0 "$backend_pid" 2>/dev/null; then
              cat > "$lifecycle_file" <<EOF
          {
            "schema_version": 1,
            "runtime_owner": "backend-rs",
            "process_target": "./target/debug/mumu-novel-backend",
            "process_pid": ${backend_pid},
            "expected_binary_path": "${expected_binary_path}",
            "observed_binary_path": "${observed_binary_path}",
            "expected_binary_sha256": "${expected_binary_sha256}",
            "observed_binary_sha256": "${observed_binary_sha256}",
            "identity_status": "verified",
            "cleanup_status": "terminated",
            "termination_signal": "TERM"
          }
          EOF
              cat "$lifecycle_file"
              cat e2e-diagnostics/rust-backend.log || true
              exit 0
            fi
            sleep 1
          done

          kill -KILL "$backend_pid" || true
          cat > "$lifecycle_file" <<EOF
          {
            "schema_version": 1,
            "runtime_owner": "backend-rs",
            "process_target": "./target/debug/mumu-novel-backend",
            "process_pid": ${backend_pid},
            "expected_binary_path": "${expected_binary_path}",
            "observed_binary_path": "${observed_binary_path}",
            "expected_binary_sha256": "${expected_binary_sha256}",
            "observed_binary_sha256": "${observed_binary_sha256}",
            "identity_status": "verified",
            "cleanup_status": "forced_kill",
            "termination_signal": "KILL"
          }
          EOF
          cat "$lifecycle_file"
          cat e2e-diagnostics/rust-backend.log || true
          exit 1

      - name: Record successful Rust E2E evidence
        if: success()
        run: |
          binary_path="$(cat e2e-diagnostics/rust-backend-binary-path.txt)"
          binary_sha256="$(cat e2e-diagnostics/rust-backend-binary-sha256.txt)"
          cat > e2e-diagnostics/runner-success.json <<EOF
          {
            "schema_version": 1,
            "evidence_status": "passed",
            "runtime_owner": "backend-rs",
            "database": "postgresql",
            "migration_executor": "passed",
            "release_readiness_preflight": "passed",
            "readyz": "passed",
            "releasez": "passed",
            "playwright_smoke": "passed",
            "backend_identity": "verified",
            "backend_lifecycle": "passed",
            "binary_path": "${binary_path}",
            "binary_sha256": "${binary_sha256}",
            "github_sha": "${GITHUB_SHA}",
            "github_run_id": "${GITHUB_RUN_ID}",
            "github_run_attempt": "${GITHUB_RUN_ATTEMPT}"
          }
          EOF
          cat e2e-diagnostics/runner-success.json

      - name: Record failed Rust E2E evidence
        if: failure()
        run: |
          cat > e2e-diagnostics/runner-failure.json <<EOF
          {
            "schema_version": 1,
            "evidence_status": "failed",
            "runtime_owner": "backend-rs",
            "diagnostics_directory": "e2e-diagnostics",
            "github_sha": "${GITHUB_SHA}",
            "github_run_id": "${GITHUB_RUN_ID}",
            "github_run_attempt": "${GITHUB_RUN_ATTEMPT}"
          }
          EOF
          cat e2e-diagnostics/runner-failure.json

      - name: Upload Rust readiness diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-readiness-diagnostics
          path: e2e-diagnostics/
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
