# =============================================================================
# MuMuNovel Strangler Fig — Docker Compose (Rust runtime + Rust migrator)
# =============================================================================
# Rust   db-migrator       — one-shot Alembic/schema migration
# Rust   (mumunovel-rs)    — 127.0.0.1:8001  runtime API + static owner
# Nginx  (mumunovel-nginx) — 0.0.0.0:80      gateway to Rust runtime
#
# 使用方式:
#   docker compose -f docker-compose.strangler.yml up -d --build
#   docker compose -f docker-compose.strangler.yml ps
#   docker compose -f docker-compose.strangler.yml logs -f
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL — 共享数据库
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: mumunovel-postgres-new
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mumuai_novel}
      POSTGRES_USER: ${POSTGRES_USER:-mumuai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mumuai} -d ${POSTGRES_DB:-mumuai_novel}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ai-story-network
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-200}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-1GB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}
      - -c
      - checkpoint_completion_target=${POSTGRES_CHECKPOINT_COMPLETION_TARGET:-0.9}
      - -c
      - wal_buffers=${POSTGRES_WAL_BUFFERS:-16MB}
      - -c
      - default_statistics_target=${POSTGRES_DEFAULT_STATISTICS_TARGET:-100}
      - -c
      - random_page_cost=${POSTGRES_RANDOM_PAGE_COST:-1.1}
      - -c
      - effective_io_concurrency=${POSTGRES_EFFECTIVE_IO_CONCURRENCY:-200}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-4MB}
      - -c
      - min_wal_size=${POSTGRES_MIN_WAL_SIZE:-1GB}
      - -c
      - max_wal_size=${POSTGRES_MAX_WAL_SIZE:-4GB}

  # ---------------------------------------------------------------------------
  # 1.5 Database migrator — 显式 schema 迁移步骤
  # ---------------------------------------------------------------------------
  db-migrator:
    build:
      context: ./backend-rs
      dockerfile: Dockerfile
    image: mumunovel-rust:latest
    container_name: mumunovel-db-migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - APP_NAME=${APP_NAME:-MuMuNovel}
      - APP_VERSION=${APP_VERSION:-1.0.0-rs}
      - APP_HOST=0.0.0.0
      - APP_PORT=8001
      - DEBUG=${DEBUG:-false}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-mumuai}:${POSTGRES_PASSWORD:-123456}@postgres:5432/${POSTGRES_DB:-mumuai_novel}
      - DATABASE_POOL_SIZE=${DATABASE_POOL_SIZE:-30}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required for stable Rust migration smoke}
      - ENABLE_STARTUP_SCHEMA_SYNC=false
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - STATIC_DIR=/app/static
      - LOCAL_AUTH_ENABLED=${LOCAL_AUTH_ENABLED:-true}
      - LOCAL_AUTH_USERNAME=${LOCAL_AUTH_USERNAME:-admin}
      - LOCAL_AUTH_PASSWORD=${LOCAL_AUTH_PASSWORD:-admin123}
      - LOCAL_AUTH_DISPLAY_NAME=${LOCAL_AUTH_DISPLAY_NAME:-本地管理员}
    restart: "no"
    entrypoint: ["/app/server"]
    command: ["migration-executor"]
    healthcheck:
      disable: true
    networks:
      - ai-story-network

  # ---------------------------------------------------------------------------
  # 2. Rust 后端 — runtime API + static owner (8001)
  # ---------------------------------------------------------------------------
  rust-backend:
    build:
      context: ./backend-rs
      dockerfile: Dockerfile
    image: mumunovel-rust:latest
    container_name: mumunovel-rust
    depends_on:
      db-migrator:
        condition: service_completed_successfully
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8001
      - APP_NAME=${APP_NAME:-MuMuNovel}
      - APP_VERSION=${APP_VERSION:-1.0.0-rs}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-mumuai}:${POSTGRES_PASSWORD:-123456}@postgres:5432/${POSTGRES_DB:-mumuai_novel}
      - DATABASE_POOL_SIZE=${DATABASE_POOL_SIZE:-50}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required for stable Rust auth}
      - ENABLE_STARTUP_SCHEMA_SYNC=false
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - STATIC_DIR=/app/static
      - LOCAL_AUTH_ENABLED=${LOCAL_AUTH_ENABLED:-true}
      - LOCAL_AUTH_USERNAME=${LOCAL_AUTH_USERNAME:-admin}
      - LOCAL_AUTH_PASSWORD=${LOCAL_AUTH_PASSWORD:-admin123}
      - LOCAL_AUTH_DISPLAY_NAME=${LOCAL_AUTH_DISPLAY_NAME:-本地管理员}
      - LINUXDO_CLIENT_ID=${LINUXDO_CLIENT_ID:-}
      - LINUXDO_CLIENT_SECRET=${LINUXDO_CLIENT_SECRET:-}
    volumes:
      - ./backend/static:/app/static:ro
      - ./.env:/app/.env:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - ai-story-network

  # ---------------------------------------------------------------------------
  # 3. Nginx 网关 — 统一入口 + Rust runtime
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: mumunovel-nginx
    ports:
      - "8005:80"
      - "8443:443"
    volumes:
      - ./deploy/nginx/mumunovel-docker.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d/proxy-common.conf:/etc/nginx/conf.d/proxy-common.conf:ro
      - ./deploy/nginx/conf.d/sse-common.conf:/etc/nginx/conf.d/sse-common.conf:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      rust-backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - ai-story-network

volumes:
  postgres_data:
    driver: local

networks:
  ai-story-network:
    driver: bridge
