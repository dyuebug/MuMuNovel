    location ~ ^/api/projects/[^/]+/check-consistency$        { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location ~ ^/api/projects/[^/]+/fix-organizations$        { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }
    location ~ ^/api/projects/[^/]+/fix-member-counts$        { proxy_pass http://rust_backend; include conf.d/proxy-common.conf; }

    # Characters: all current CRUD + generation compatibility endpoints are implemented in Rust.
